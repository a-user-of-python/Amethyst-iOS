name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build Amethyst IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch MobileGlues for Darwin
        run: |
          find Natives/external/MobileGlues/MobileGlues-cpp -name "*.cpp" -o -name "*.h" | xargs sed -i '' 's/__attribute__((alias([^)]*)))//g'
          sed -i '' 's|#include <sys/syscall.h>|#include <pthread.h>|' Natives/external/MobileGlues/MobileGlues-cpp/egl/trace.h
          sed -i '' 's/return (int)syscall(__NR_gettid);/uint64_t _tid; pthread_threadid_np(NULL, \&_tid); return (int)_tid;/' Natives/external/MobileGlues/MobileGlues-cpp/egl/trace.h
          sed -i '' 's/target_link_options(${CMAKE_PROJECT_NAME} PRIVATE -Wl,-Bsymbolic-functions)//' Natives/external/MobileGlues/MobileGlues-cpp/CMakeLists.txt
          sed -i '' 's/global_settings.ignore_error = IgnoreErrorLevel::Partial;/global_settings.ignore_error = IgnoreErrorLevel::Full;/' Natives/external/MobileGlues/MobileGlues-cpp/config/settings.cpp
          echo "Patched MobileGlues for Darwin"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install make cmake ninja pkg-config ldid
          brew install --cask zulu@8

      - name: Build IPA
        env:
          BOOTJDK: /Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home/bin
          SLIMMED: "1"
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-${{ inputs.version }}
          path: artifacts/*.ipa
