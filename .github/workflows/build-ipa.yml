name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build Amethyst IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        run: |
          git config --global protocol.file.allow always
          for mod in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            section=$(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | grep "$mod$" | sed 's/submodule\.\(.*\)\.path/\1/')
            url=$(git config --file .gitmodules --get "submodule.$section.url")
            case "$url" in
              *khanhduytran0*) echo "Skipping deleted repo: $mod ($url)"; continue;;
            esac
            echo "Init: $mod"
            git submodule update --init --depth 1 "$mod" || git submodule update --init "$mod" || echo "Failed: $mod"
          done

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install make cmake ninja pkg-config

      - name: Build IPA
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-${{ inputs.version }}
          path: artifacts/*.ipa
