name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build Amethyst IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        run: |
          git submodule update --init --recursive --depth 1 || {
            echo "Submodule init failed, trying without depth limit"
            git submodule update --init --recursive
          }

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install make cmake ninja pkg-config

      - name: Build MobileGlues
        run: |
          cd Natives/external/MobileGlues
          # MobileGlues build for iOS via Amethyst's Makefile handles this
          cd ../..

      - name: Build IPA
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-${{ inputs.version }}
          path: artifacts/*.ipa
